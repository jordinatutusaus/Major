<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Major — El teu assistent personal</title>

  <meta
    name="description"
    content="Major és el teu assistent personal per organitzar demandes, tasques, llistes, recordatoris, dates importants i fotos."
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f4edff);
      color: #222;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    .login {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
      text-align: center;

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;

      border: 1px solid #ddd;
      border-radius: 12px;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6d5dfc;
    }

    .login-button {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 12px;

      background: #5b6cff;
      color: white;

      font-size: 17px;
      font-weight: bold;
    }

    .create {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }

    .create span {
      color: #6d5dfc;
      font-weight: bold;
      cursor: pointer;
    }

    .language {
      margin-top: 25px;
    }

    select {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    /* =========================
       APP PRINCIPAL
    ========================= */

    .app {
      display: none;
      min-height: 100vh;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .profile-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-button {
      width: 58px;
      height: 58px;

      border-radius: 50%;
      border: none;

      background: linear-gradient(135deg, #4f7cff, #8b5cf6);

      color: white;
      font-size: 27px;

      box-shadow: 0 8px 20px rgba(91,108,255,.3);
    }

    .edit-profile-button {
      width: 34px;
      height: 34px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 17px;

      box-shadow: 0 5px 15px rgba(0,0,0,.12);
    }

    /* =========================
       CENTRE
    ========================= */

    .welcome {
      text-align: center;

      margin-top: 180px;
    }

    .current-time {
      font-size: 72px;
      font-weight: bold;
      letter-spacing: -3px;
    }

    .user-name {
      margin-top: 10px;
      color: #777;
      font-size: 20px;
    }

    /* =========================
       PANELL LILA
    ========================= */

    .panel {
      display: none;

      position: fixed;
      top: 0;
      right: 0;

      width: 430px;
      max-width: 92%;

      height: 100vh;

      background: linear-gradient(160deg, #725cff, #9b5de5);

      color: white;

      padding: 25px;

      box-shadow: -10px 0 35px rgba(0,0,0,.2);

      z-index: 10;

      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      justify-content: flex-end;
    }

    .close-button {
      width: 45px;
      height: 45px;

      border-radius: 50%;
      border: none;

      background: rgba(255,255,255,.18);

      color: white;

      font-size: 28px;
    }

    .panel-main {
      text-align: center;
      margin-top: 40px;
    }

    .panel-title {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .panel-description {
      opacity: .85;
      line-height: 1.5;
      margin-bottom: 35px;
    }

    /* =========================
       OPCIONS DEL PANELL
    ========================= */

    .panel-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-option {
      width: 100%;

      padding: 18px;

      border: none;
      border-radius: 16px;

      background: rgba(255,255,255,.16);

      color: white;

      text-align: left;

      font-size: 17px;

      transition: .15s;
    }

    .panel-option:hover {
      background: rgba(255,255,255,.25);
      transform: translateY(-1px);
    }

    .option-icon {
      margin-right: 10px;
      font-size: 22px;
    }

    /* =========================
       MICRO
    ========================= */

    .micro-section {
      text-align: center;
      margin-top: 35px;
    }

    .mic-button {
      width: 115px;
      height: 115px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 48px;

      box-shadow: 0 12px 30px rgba(0,0,0,.22);

      transition: transform .15s;
    }

    .mic-button:active {
      transform: scale(.94);
    }

    .mic-button.listening {
      transform: scale(1.08);

      box-shadow:
        0 0 0 12px rgba(255,255,255,.18),
        0 12px 30px rgba(0,0,0,.22);
    }

    .mic-text {
      margin-top: 18px;

      font-size: 15px;
      opacity: .9;

      line-height: 1.5;
    }

    /* =========================
       DEMANDES
    ========================= */

    .section {
      display: none;
    }

    .section-title {
      font-size: 28px;
      margin: 25px 0;
    }

    .back-button {
      border: none;
      background: rgba(255,255,255,.16);

      color: white;

      padding: 10px 14px;
      border-radius: 10px;

      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-button {
      border: none;
      border-radius: 20px;

      padding: 8px 12px;

      background: rgba(255,255,255,.16);
      color: white;
    }

    .filter-button.active {
      background: white;
      color: #765cff;
    }

    .request-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .request {
      background: white;
      color: #222;

      border-radius: 16px;

      padding: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .request-info {
      flex: 1;
    }

    .request-type {
      font-size: 12px;
      color: #765cff;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .request-text {
      font-size: 15px;
    }

    .delete-button {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: #f2f2f2;

      font-size: 17px;
    }

    .empty {
      text-align: center;
      opacity: .8;
      padding: 30px 10px;
    }

    /* =========================
       GALERIA
    ========================= */

    .album-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .album {
      background: rgba(255,255,255,.16);

      border-radius: 15px;

      padding: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .album button {
      border: none;
      background: white;
      color: #765cff;

      padding: 8px 12px;
      border-radius: 9px;
    }

    .gallery-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .gallery-actions button {
      flex: 1;

      padding: 12px;

      border: none;
      border-radius: 12px;

      background: white;
      color: #765cff;

      font-weight: bold;
    }

    .photo-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;
    }

    .photo-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      color: #222;
    }

    .photo-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .photo-card-bottom {
      padding: 8px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .photo-delete {
      border: none;
      background: transparent;
      font-size: 16px;
    }

    /* =========================
       PERFIL
    ========================= */

    .profile-editor {
      background: white;
      color: #222;

      border-radius: 18px;

      padding: 20px;

      margin-top: 20px;
    }

    .profile-preview {
      width: 80px;
      height: 80px;

      margin: 0 auto 15px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg,#4f7cff,#8b5cf6);

      color: white;

      font-size: 38px;
    }

    .emoji-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      justify-content: center;

      margin: 15px 0;
    }

    .emoji-choice {
      width: 45px;
      height: 45px;

      border: none;
      border-radius: 50%;

      background: #f1f1f1;

      font-size: 23px;
    }

    .name-input {
      width: 100%;
    }

    .save-profile {
      width: 100%;

      padding: 12px;

      border: none;
      border-radius: 10px;

      background: #765cff;
      color: white;

      font-weight: bold;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 500px) {

      .current-time {
        font-size: 55px;
      }

      .welcome {
        margin-top: 170px;
      }

      .panel {
        width: 100%;
        max-width: 100%;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <div class="login" id="loginScreen">

    <div class="logo">M</div>

    <h1>Major</h1>

    <p class="subtitle" id="subtitle">
      El teu assistent personal
    </p>

    <input
      type="email"
      id="email"
      placeholder="Correu electrònic"
    >

    <input
      type="password"
      id="password"
      placeholder="Contrasenya"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      Iniciar sessió
    </button>

    <p class="create">
      Encara no tens compte?
      <span onclick="createAccount()">
        Crear compte
      </span>
    </p>

    <div class="language">

      <select
        id="language"
        onchange="changeLanguage()"
      >
        <option value="ca">Català</option>
        <option value="es">Castellà</option>
        <option value="en">English</option>
      </select>

    </div>

    <div
      class="message"
      id="message"
    ></div>

  </div>


  <!-- =========================
       APP
  ========================= -->

  <div
    class="app"
    id="appScreen"
  >

    <div class="topbar">

      <div class="profile-wrapper">

        <button
          class="user-button"
          id="userButton"
          onclick="openPanel()"
        >
          😊
        </button>

        <button
          class="edit-profile-button"
          onclick="openProfileEditor()"
        >
          ✏️
        </button>

      </div>

    </div>


    <div class="welcome">

      <div
        class="current-time"
        id="currentTime"
      >
        00:00
      </div>

      <div
        class="user-name"
        id="userName"
      >
        El teu nom
      </div>

    </div>

  </div>


  <!-- =========================
       PANELL
  ========================= -->

  <div
    class="panel"
    id="panel"
  >

    <div class="panel-header">

      <button
        class="close-button"
        onclick="closePanel()"
      >
        ×
      </button>

    </div>


    <!-- MENU PRINCIPAL -->

    <div
      class="section"
      id="mainSection"
      style="display:block;"
    >

      <div class="panel-main">

        <div class="panel-title">
          Què farem avui?
        </div>

        <div class="panel-description">
          Digues-me què necessites i Major ho organitzarà.
        </div>


        <div class="panel-options">

          <button
            class="panel-option"
            onclick="showRequests()"
          >
            <span class="option-icon">📋</span>
            Demandes
          </button>


          <button
            class="panel-option"
            onclick="showGallery()"
          >
            <span class="option-icon">📸</span>
            Fotos i àlbums
          </button>

        </div>


        <!-- MICRO -->

        <div class="micro-section">

          <button
            class="mic-button"
            id="micButton"
            onclick="startMicrophone()"
          >
            🎙️
          </button>

          <div
            class="mic-text"
            id="micText"
          >
            Prem el micròfon i parla
          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         DEMANDES
    ========================= -->

    <div
      class="section"
      id="requestsSection"
    >

      <button
        class="back-button"
        onclick="showMain()"
      >
        ← Tornar
      </button>

      <div class="section-title">
        📋 Demandes
      </div>


      <div class="filters">

        <button
          class="filter-button active"
          onclick="filterRequests('totes', this)"
        >
          Totes
        </button>

        <button
          class="filter-button"
          onclick="filterRequests('tasca', this)"
        >
          Tasques
        </button>

        <button
          class="filter-button"
          onclick="filterRequests('llista', this)"
        >
          Llistes
        </button>

        <button
          class="filter-button"
          onclick="filterRequests('recordatori', this)"
        >
          Recordatoris
        </button>

        <button
          class="filter-button"
          onclick="filterRequests('data', this)"
        >
          Dates
        </button>

      </div>


      <div
        class="request-list"
        id="requestList"
      ></div>

    </div>


    <!-- =========================
         GALERIA
    ========================= -->

    <div
      class="section"
      id="gallerySection"
    >

      <button
        class="back-button"
        onclick="showMain()"
      >
        ← Tornar
      </button>

      <div class="section-title">
        📸 Fotos i àlbums
      </div>


      <div class="gallery-actions">

        <button
          onclick="createAlbum()"
        >
          📁 Nou àlbum
        </button>

        <button
          onclick="uploadPhoto()"
        >
          📷 Afegir foto
        </button>

      </div>


      <div
        class="album-list"
        id="albumList"
      ></div>


      <div
        class="photo-grid"
        id="photoGrid"
      ></div>

    </div>


    <!-- =========================
         EDITOR PERFIL
    ========================= -->

    <div
      class="section"
      id="profileSection"
    >

      <button
        class="back-button"
        onclick="showMain()"
      >
        ← Tornar
      </button>

      <div class="section-title">
        ✏️ Perfil
      </div>


      <div class="profile-editor">

        <div
          class="profile-preview"
          id="profilePreview"
        >
          😊
        </div>


        <div class="emoji-options">

          <button
            class="emoji-choice"
            onclick="chooseEmoji('😊')"
          >
            😊
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('😎')"
          >
            😎
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('🥰')"
          >
            🥰
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('🤓')"
          >
            🤓
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('🐶')"
          >
            🐶
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('🐱')"
          >
            🐱
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('🦊')"
          >
            🦊
          </button>

          <button
            class="emoji-choice"
            onclick="chooseEmoji('⭐')"
          >
            ⭐
          </button>

        </div>


        <input
          class="name-input"
          id="profileName"
          placeholder="El teu nom"
        >


        <button
          class="save-profile"
          onclick="saveProfile()"
        >
          Guardar
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://vogfwuvdlusuzofvlmoj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__F0Kohyak7yCiF5pSDe2uw_wKJkJnfn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       DADES LOCALS
    ========================= */

    let requests =
      JSON.parse(
        localStorage.getItem("majorRequests") || "[]"
      );

    let albums =
      JSON.parse(
        localStorage.getItem("majorAlbums") || "[]"
      );

    let photos =
      JSON.parse(
        localStorage.getItem("majorPhotos") || "[]"
      );

    let profile =
      JSON.parse(
        localStorage.getItem("majorProfile") ||
        '{"name":"El teu nom","emoji":"😊"}'
      );


    let currentFilter = "totes";


    /* =========================
       LOGIN
    ========================= */

    function showMessage(text) {

      document.getElementById(
        "message"
      ).textContent = text;

    }


    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email || !password) {

        showMessage(
          "Escriu el correu i la contrasenya."
        );

        return;
      }


      showMessage(
        "Iniciant sessió..."
      );


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        showMessage(
          "El correu o la contrasenya no són correctes."
        );

        return;
      }


      entrar(data.user);

    }


    async function createAccount() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email || !password) {

        showMessage(
          "Escriu un correu i una contrasenya."
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "La contrasenya ha de tenir almenys 6 caràcters."
        );

        return;
      }


      showMessage(
        "Creant el compte..."
      );


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,
          password: password

        });


      if (error) {

        showMessage(
          error.message
        );

        return;
      }


      if (data.session) {

        entrar(data.user);

      } else {

        showMessage(
          "Compte creat! Revisa el teu correu."
        );

      }

    }


    function entrar(user) {

      document.getElementById(
        "loginScreen"
      ).style.display = "none";

      document.getElementById(
        "appScreen"
      ).style.display = "block";


      loadProfile();

      updateClock();

      setInterval(
        updateClock,
        1000
      );

    }


    /* =========================
       HORA
    ========================= */

    function updateClock() {

      const now =
        new Date();


      const hours =
        String(
          now.getHours()
        ).padStart(2,"0");


      const minutes =
        String(
          now.getMinutes()
        ).padStart(2,"0");


      document.getElementById(
        "currentTime"
      ).textContent =
        hours + ":" + minutes;

    }


    /* =========================
       PERFIL
    ========================= */

    function loadProfile() {

      document.getElementById(
        "userButton"
      ).textContent =
        profile.emoji;


      document.getElementById(
        "userName"
      ).textContent =
        profile.name;


      document.getElementById(
        "profilePreview"
      ).textContent =
        profile.emoji;


      document.getElementById(
        "profileName"
      ).value =
        profile.name;

    }


    function openProfileEditor() {

      openPanel();

      hideAllSections();

      document.getElementById(
        "profileSection"
      ).style.display =
        "block";

    }


    function chooseEmoji(emoji) {

      profile.emoji =
        emoji;


      document.getElementById(
        "profilePreview"
      ).textContent =
        emoji;

    }


    function saveProfile() {

      const name =
        document.getElementById(
          "profileName"
        ).value.trim();


      if (name) {

        profile.name =
          name;

      }


      localStorage.setItem(
        "majorProfile",
        JSON.stringify(profile)
      );


      loadProfile();

      showMain();

    }


    /* =========================
       PANELL
    ========================= */

    function openPanel() {

      document.getElementById(
        "panel"
      ).style.display =
        "block";

      showMain();

    }


    function closePanel() {

      document.getElementById(
        "panel"
      ).style.display =
        "none";

    }


    function hideAllSections() {

      document.getElementById(
        "mainSection"
      ).style.display =
        "none";

      document.getElementById(
        "requestsSection"
      ).style.display =
        "none";

      document.getElementById(
        "gallerySection"
      ).style.display =
        "none";

      document.getElementById(
        "profileSection"
      ).style.display =
        "none";

    }


    function showMain() {

      hideAllSections();

      document.getElementById(
        "mainSection"
      ).style.display =
        "block";

    }


    /* =========================
       DEMANDES
    ========================= */

    function showRequests() {

      hideAllSections();

      document.getElementById(
        "requestsSection"
      ).style.display =
        "block";

      renderRequests();

    }


    function addRequest(text, type) {

      const request = {

        id:
          Date.now(),

        text:
          text,

        type:
          type,

        created:
          new Date().toISOString()

      };


      requests.unshift(
        request
      );


      localStorage.setItem(
        "majorRequests",
        JSON.stringify(requests)
      );


      renderRequests();

    }


    function deleteRequest(id) {

      requests =
        requests.filter(
          function(request) {

            return request.id !== id;

          }
        );


      localStorage.setItem(
        "majorRequests",
        JSON.stringify(requests)
      );


      renderRequests();

    }


    function typeName(type) {

      if (type === "tasca")
        return "TASCA";

      if (type === "llista")
        return "LLISTA";

      if (type === "recordatori")
        return "RECORDATORI";

      if (type === "data")
        return "DATA IMPORTANT";

      return "DEMANDA";

    }


    function typeIcon(type) {

      if (type === "tasca")
        return "✅";

      if (type === "llista")
        return "🛒";

      if (type === "recordatori")
        return "🔔";

      if (type === "data")
        return "📅";

      return "📝";

    }


    function renderRequests() {

      const list =
        document.getElementById(
          "requestList"
        );


      list.innerHTML = "";


      const filtered =
        requests.filter(
          function(request) {

            if (
              currentFilter ===
              "totes"
            ) {

              return true;

            }

            return request.type ===
              currentFilter;

          }
        );


      if (
        filtered.length === 0
      ) {

        list.innerHTML =
          '<div class="empty">Encara no tens demandes aquí.</div>';

        return;
      }


      filtered.forEach(
        function(request) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "request";


          item.innerHTML = `

            <div class="request-info">

              <div class="request-type">
                ${typeIcon(request.type)}
                ${typeName(request.type)}
              </div>

              <div class="request-text">
                ${escapeHTML(request.text)}
              </div>

            </div>

            <button
              class="delete-button"
              onclick="deleteRequest(${request.id})"
              title="Eliminar"
            >
              🗑️
            </button>

          `;


          list.appendChild(
            item
          );

        }
      );

    }


    function filterRequests(
      type,
      button
    ) {

      currentFilter =
        type;


      document
        .querySelectorAll(
          ".filter-button"
        )
        .forEach(
          function(btn) {

            btn.classList.remove(
              "active"
            );

          }
        );


      button.classList.add(
        "active"
      );


      renderRequests();

    }


    /* =========================
       DETECTAR TIPUS DE DEMANDA
    ========================= */

    function detectRequestType(text) {

      const lower =
        text.toLowerCase();


      /* LLISTA */

      const listWords = [

        "llista",
        "llista de",
        "compra",
        "comprar",
        "afegeix",
        "afegir",
        "necessito comprar"

      ];


      if (
        listWords.some(
          word =>
            lower.includes(word)
        )
      ) {

        return "llista";

      }


      /* RECORDATORI */

      const reminderWords = [

        "recorda'm",
        "recordam",
        "recorda",
        "recordatori",
        "no t'oblidis",
        "no oblidis"

      ];


      if (
        reminderWords.some(
          word =>
            lower.includes(word)
        )
      ) {

        return "recordatori";

      }


      /* DATES */

      const dateWords = [

        "aniversari",
        "aniversaris",
        "cumpleanys",
        "aniversario",
        "data important",
        "el dia",
        "el 1",
        "el 2",
        "el 3",
        "el 4",
        "el 5",
        "el 6",
        "el 7",
        "el 8",
        "el 9",
        "el 10",
        "el 11",
        "el 12",
        "el 13",
        "el 14",
        "el 15",
        "el 16",
        "el 17",
        "el 18",
        "el 19",
        "el 20",
        "el 21",
        "el 22",
        "el 23",
        "el 24",
        "el 25",
        "el 26",
        "el 27",
        "el 28",
        "el 29",
        "el 30",
        "el 31"

      ];


      if (
        dateWords.some(
          word =>
            lower.includes(word)
        )
      ) {

        return "data";

      }


      /* TASQUES */

      const taskWords = [

        "he de",
        "tinc de",
        "haig de",
        "necessito fer",
        "fer els",
        "fer la",
        "fer el",
        "demà he",
        "avui he"

      ];


      if (
        taskWords.some(
          word =>
            lower.includes(word)
        )
      ) {

        return "tasca";

      }


      return "demanda";

    }


    /* =========================
       MICROFON
    ========================= */

    function startMicrophone() {

      const text =
        document.getElementById(
          "micText"
        );

      const button =
        document.getElementById(
          "micButton"
        );


      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        text.textContent =
          "El teu navegador no suporta el reconeixement de veu.";

        return;
      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "ca-ES";

      recognition.continuous =
        false;

      recognition.interimResults =
        false;


      text.textContent =
        "🎙️ T'estic escoltant...";


      button.classList.add(
        "listening"
      );


      try {

        recognition.start();

      } catch (error) {

        button.classList.remove(
          "listening"
        );

        text.textContent =
          "Torna a prémer el micròfon.";

        return;
      }


      recognition.onresult =
        function(event) {

          const resultat =
            event.results[0][0]
              .transcript
              .trim();


          const type =
            detectRequestType(
              resultat
            );


          addRequest(
            resultat,
            type
          );


          text.textContent =
            typeIcon(type) +
            " " +
            typeName(type) +
            " detectat";


          setTimeout(
            function() {

              text.textContent =
                "Has dit: " +
                resultat;

            },
            2500
          );

        };


      recognition.onerror =
        function(event) {

          button.classList.remove(
            "listening"
          );


          if (
            event.error ===
            "not-allowed"
          ) {

            text.textContent =
              "Has de donar permís al micròfon.";

          } else {

            text.textContent =
              "No he pogut escoltar-te. Torna-ho a provar.";

          }

        };


      recognition.onend =
        function() {

          button.classList.remove(
            "listening"
          );

        };

    }


    /* =========================
       GALERIA
    ========================= */

    function showGallery() {

      hideAllSections();

      document.getElementById(
        "gallerySection"
      ).style.display =
        "block";


      renderAlbums();

      renderPhotos();

    }


    function createAlbum() {

      const name =
        prompt(
          "Com vols anomenar l'àlbum?"
        );


      if (!name) {
        return;
      }


      albums.push({

        id:
          Date.now(),

        name:
          name

      });


      localStorage.setItem(
        "majorAlbums",
        JSON.stringify(albums)
      );


      renderAlbums();

    }


    function renderAlbums() {

      const list =
        document.getElementById(
          "albumList"
        );


      list.innerHTML = "";


      if (
        albums.length === 0
      ) {

        list.innerHTML =
          '<div class="empty">Encara no tens cap àlbum.</div>';

        return;
      }


      albums.forEach(
        function(album) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "album";


          div.innerHTML = `

            <span>
              📁 ${escapeHTML(album.name)}
            </span>

            <button
              onclick="deleteAlbum(${album.id})"
            >
              🗑️
            </button>

          `;


          list.appendChild(
            div
          );

        }
      );

    }


    function deleteAlbum(id) {

      albums =
        albums.filter(
          album =>
            album.id !== id
        );


      localStorage.setItem(
        "majorAlbums",
        JSON.stringify(albums)
      );


      renderAlbums();

    }


    function uploadPhoto() {

      const input =
        document.createElement(
          "input"
        );


      input.type =
        "file";

      input.accept =
        "image/*";


      input.onchange =
        function(event) {

          const file =
            event.target.files[0];


          if (!file) {
            return;
          }


          const reader =
            new FileReader();


          reader.onload =
            function(e) {

              photos.push({

                id:
                  Date.now(),

                name:
                  file.name,

                data:
                  e.target.result

              });


              localStorage.setItem(
                "majorPhotos",
                JSON.stringify(photos)
              );


              renderPhotos();

            };


          reader.readAsDataURL(
            file
          );

        };


      input.click();

    }


    function renderPhotos() {

      const grid =
        document.getElementById(
          "photoGrid"
        );


      grid.innerHTML = "";


      photos.forEach(
        function(photo) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "photo-card";


          card.innerHTML = `

            <img
              src="${photo.data}"
              alt="${escapeHTML(photo.name)}"
            >

            <div class="photo-card-bottom">

              <span>
                📷
              </span>

              <button
                class="photo-delete"
                onclick="deletePhoto(${photo.id})"
              >
                🗑️
              </button>

            </div>

          `;


          grid.appendChild(
            card
          );

        }
      );

    }


    function deletePhoto(id) {

      photos =
        photos.filter(
          photo =>
            photo.id !== id
        );


      localStorage.setItem(
        "majorPhotos",
        JSON.stringify(photos)
      );


      renderPhotos();

    }


    /* =========================
       SEGURETAT HTML
    ========================= */

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    /* =========================
       IDIOMES
    ========================= */

    function changeLanguage() {

      const language =
        document.getElementById(
          "language"
        ).value;

      const subtitle =
        document.getElementById(
          "subtitle"
        );

      const email =
        document.getElementById(
          "email"
        );

      const password =
        document.getElementById(
          "password"
        );

      const button =
        document.querySelector(
          ".login-button"
        );

      const create =
        document.querySelector(
          ".create"
        );


      if (language === "ca") {

        subtitle.textContent =
          "El teu assistent personal";

        email.placeholder =
          "Correu electrònic";

        password.placeholder =
          "Contrasenya";

        button.textContent =
          "Iniciar sessió";

        create.innerHTML =
          'Encara no tens compte? <span onclick="createAccount()">Crear compte</span>';

      }

      else if (language === "es") {

        subtitle.textContent =
          "Tu asistente personal";

        email.placeholder =
          "Correo electrónico";

        password.placeholder =
          "Contraseña";

        button.textContent =
          "Iniciar sesión";

        create.innerHTML =
          '¿Todavía no tienes cuenta? <span onclick="createAccount()">Crear cuenta</span>';

      }

      else {

        subtitle.textContent =
          "Your personal assistant";

        email.placeholder =
          "Email";

        password.placeholder =
          "Password";

        button.textContent =
          "Log in";

        create.innerHTML =
          'Don’t have an account? <span onclick="createAccount()">Create account</span>';

      }

    }

  </script>
