<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Major</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f4edff);
      color: #222;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    .login {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
      text-align: center;

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;

      border: 1px solid #ddd;
      border-radius: 12px;

      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #6d5dfc;
    }

    .login-button {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 12px;

      background: #5b6cff;
      color: white;

      font-size: 17px;
      font-weight: bold;
    }

    .create {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }

    .create span {
      color: #6d5dfc;
      font-weight: bold;
      cursor: pointer;
    }

    .language {
      margin-top: 25px;
    }

    .language select {
      width: auto;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }


    /* =========================
       APP PRINCIPAL
    ========================= */

    .app {
      display: none;
      min-height: 100vh;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
    }

    .user-button {
      width: 62px;
      height: 62px;

      border-radius: 50%;
      border: none;

      background: white;

      font-size: 30px;

      box-shadow: 0 8px 20px rgba(91,108,255,.25);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome {
      text-align: center;
      margin-top: 150px;
    }

    .clock {
      font-size: 64px;
      font-weight: bold;
      letter-spacing: -2px;
    }

    .username-display {
      margin-top: 8px;
      color: #777;
      font-size: 17px;
    }


    /* =========================
       PANELL LILA
    ========================= */

    .panel {
      display: none;

      position: fixed;
      top: 0;
      right: 0;

      width: 430px;
      max-width: 94%;

      height: 100vh;

      background: linear-gradient(160deg, #725cff, #9b5de5);

      color: white;

      padding: 25px;

      box-shadow: -10px 0 35px rgba(0,0,0,.2);

      z-index: 10;

      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-logo {
      font-size: 25px;
      font-weight: bold;
    }

    .close-button {
      width: 45px;
      height: 45px;

      border-radius: 50%;
      border: none;

      background: rgba(255,255,255,.18);

      color: white;

      font-size: 28px;
    }

    .panel-main {
      padding-top: 35px;
    }

    .panel-question {
      text-align: center;

      font-size: 29px;
      font-weight: bold;

      margin-bottom: 25px;
    }


    /* =========================
       MICROFON
    ========================= */

    .mic-area {
      text-align: center;
      margin-bottom: 35px;
    }

    .mic-button {
      width: 115px;
      height: 115px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 48px;

      box-shadow: 0 12px 30px rgba(0,0,0,.22);

      transition: transform .15s;
    }

    .mic-button:active {
      transform: scale(.94);
    }

    .mic-button.listening {
      transform: scale(1.08);

      box-shadow:
        0 0 0 12px rgba(255,255,255,.18),
        0 12px 30px rgba(0,0,0,.22);
    }

    .mic-text {
      margin-top: 18px;

      font-size: 15px;
      opacity: .9;

      line-height: 1.5;
    }


    /* =========================
       SECCIONS
    ========================= */

    .section {
      margin-top: 25px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .section-title h3 {
      font-size: 20px;
    }

    .section-card {
      background: rgba(255,255,255,.14);

      border-radius: 16px;

      padding: 14px;

      margin-bottom: 10px;
    }


    /* =========================
       DEMANDES
    ========================= */

    .request {
      background: white;
      color: #222;

      border-radius: 14px;

      padding: 13px;

      margin-bottom: 10px;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .request-info {
      flex: 1;
    }

    .request-type {
      font-size: 12px;
      color: #765cff;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .request-text {
      font-size: 15px;
      line-height: 1.35;
    }

    .delete-button {
      width: 35px;
      height: 35px;

      border: none;
      border-radius: 9px;

      background: #f3f3f3;

      font-size: 17px;
    }

    .empty {
      text-align: center;
      opacity: .75;
      font-size: 14px;
      padding: 15px;
    }


    /* =========================
       BOTÓ +
    ========================= */

    .add-button {
      position: fixed;

      bottom: 30px;
      right: 30px;

      width: 62px;
      height: 62px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 38px;

      box-shadow: 0 10px 25px rgba(0,0,0,.2);

      z-index: 20;
    }


    /* =========================
       CAIXA AFEGIR
    ========================= */

    .add-box {
      display: none;

      position: fixed;

      bottom: 105px;
      right: 25px;

      width: 360px;
      max-width: calc(100% - 50px);

      background: white;
      color: #222;

      border-radius: 18px;

      padding: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,.25);

      z-index: 30;
    }

    .add-box h3 {
      margin-bottom: 15px;
    }

    .add-box select {
      margin-bottom: 10px;
    }

    .save-button {
      width: 100%;

      padding: 12px;

      border: none;
      border-radius: 10px;

      background: #765cff;
      color: white;

      font-weight: bold;
    }


    /* =========================
       PERFIL
    ========================= */

    .profile-editor {
      display: none;

      background: white;
      color: #222;

      border-radius: 18px;

      padding: 20px;

      margin-top: 15px;
    }

    .profile-editor h3 {
      margin-bottom: 15px;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;

      margin-bottom: 15px;
    }

    .emoji-option {
      border: none;
      background: #f4f4f4;

      border-radius: 10px;

      padding: 8px;

      font-size: 24px;
    }

    .emoji-option:hover {
      background: #e9e5ff;
    }


    /* =========================
       GALERIA
    ========================= */

    .gallery-box {
      background: rgba(255,255,255,.14);

      border-radius: 16px;

      padding: 15px;
    }

    .gallery-button {
      width: 100%;

      padding: 12px;

      border: none;
      border-radius: 10px;

      background: white;
      color: #765cff;

      font-weight: bold;
    }

    .gallery-preview {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 8px;

      margin-top: 12px;
    }

    .gallery-preview div {
      height: 80px;

      background: rgba(255,255,255,.2);

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
    }

    .album-title {
      font-size: 14px;
      opacity: .8;
      margin-top: 12px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 500px) {

      .clock {
        font-size: 50px;
      }

      .welcome {
        margin-top: 130px;
      }

      .panel {
        width: 100%;
        max-width: 100%;
      }

      .add-box {
        width: auto;
      }

    }
  </style>
</head>

<body>


  <!-- =========================
       LOGIN
  ========================= -->

  <div class="login" id="loginScreen">

    <div class="logo">
      M
    </div>

    <h1>
      Major
    </h1>

    <p class="subtitle" id="subtitle">
      El teu assistent personal
    </p>

    <input
      type="email"
      id="email"
      placeholder="Correu electrònic"
    >

    <input
      type="password"
      id="password"
      placeholder="Contrasenya"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      Iniciar sessió
    </button>

    <p class="create">
      Encara no tens compte?
      <span onclick="createAccount()">
        Crear compte
      </span>
    </p>

    <div class="language">

      <select
        id="language"
        onchange="changeLanguage()"
      >

        <option value="ca">
          Català
        </option>

        <option value="es">
          Castellà
        </option>

        <option value="en">
          English
        </option>

      </select>

    </div>

    <div
      class="message"
      id="message"
    ></div>

  </div>


  <!-- =========================
       APP
  ========================= -->

  <div
    class="app"
    id="appScreen"
  >

    <div class="topbar">

      <button
        class="user-button"
        id="userButton"
        onclick="openPanel()"
      >
        🙂
      </button>

    </div>

    <div class="welcome">

      <div
        class="clock"
        id="clock"
      >
        00:00
      </div>

      <div
        class="username-display"
        id="usernameDisplay"
      >
        Usuari
      </div>

    </div>

  </div>


  <!-- =========================
       PANELL
  ========================= -->

  <div
    class="panel"
    id="panel"
  >

    <div class="panel-header">

      <div class="panel-logo">
        Major
      </div>

      <button
        class="close-button"
        onclick="closePanel()"
      >
        ×
      </button>

    </div>


    <div class="panel-main">

      <div class="panel-question">
        Què farem avui?
      </div>


      <!-- MICRO -->

      <div class="mic-area">

        <button
          class="mic-button"
          id="micButton"
          onclick="startMicrophone()"
        >
          🎙️
        </button>

        <div
          class="mic-text"
          id="micText"
        >
          Prem el micròfon i explica'm què necessites
        </div>

      </div>


      <!-- PERFIL -->

      <div class="section">

        <div class="section-title">

          <h3>
            👤 Perfil
          </h3>

          <button
            onclick="toggleProfileEditor()"
            style="
              border:none;
              background:rgba(255,255,255,.18);
              color:white;
              border-radius:8px;
              padding:7px 10px;
            "
          >
            ✏️
          </button>

        </div>


        <div
          class="profile-editor"
          id="profileEditor"
        >

          <h3>
            Escull el teu emoji
          </h3>

          <div class="emoji-grid">

            <button class="emoji-option" onclick="changeEmoji('🙂')">🙂</button>
            <button class="emoji-option" onclick="changeEmoji('😀')">😀</button>
            <button class="emoji-option" onclick="changeEmoji('😎')">😎</button>
            <button class="emoji-option" onclick="changeEmoji('🥰')">🥰</button>
            <button class="emoji-option" onclick="changeEmoji('🤩')">🤩</button>
            <button class="emoji-option" onclick="changeEmoji('😂')">😂</button>

            <button class="emoji-option" onclick="changeEmoji('😇')">😇</button>
            <button class="emoji-option" onclick="changeEmoji('🤓')">🤓</button>
            <button class="emoji-option" onclick="changeEmoji('😜')">😜</button>
            <button class="emoji-option" onclick="changeEmoji('🥳')">🥳</button>
            <button class="emoji-option" onclick="changeEmoji('🤠')">🤠</button>
            <button class="emoji-option" onclick="changeEmoji('👻')">👻</button>

            <button class="emoji-option" onclick="changeEmoji('🐶')">🐶</button>
            <button class="emoji-option" onclick="changeEmoji('🐱')">🐱</button>
            <button class="emoji-option" onclick="changeEmoji('🐼')">🐼</button>
            <button class="emoji-option" onclick="changeEmoji('🦊')">🦊</button>
            <button class="emoji-option" onclick="changeEmoji('🐸')">🐸</button>
            <button class="emoji-option" onclick="changeEmoji('🦄')">🦄</button>

          </div>

        </div>

      </div>


      <!-- DEMANDES -->

      <div class="section">

        <div class="section-title">

          <h3>
            📋 Demandes
          </h3>

        </div>

        <div id="requestsList">

          <div class="empty">
            Encara no tens demandes.
          </div>

        </div>

      </div>


      <!-- GALERIA -->

      <div class="section">

        <div class="section-title">

          <h3>
            📸 Galeria
          </h3>

        </div>

        <div class="gallery-box">

          <button
            class="gallery-button"
            onclick="openGallery()"
          >
            📸 Afegir fotos
          </button>

          <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
            style="display:none"
            onchange="addPhotos(event)"
          >

          <div
            class="album-title"
            id="albumTitle"
          >
            Àlbum principal
          </div>

          <div
            class="gallery-preview"
            id="galleryPreview"
          >
          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         BOTÓ +
    ========================= -->

    <button
      class="add-button"
      onclick="openAddBox()"
    >
      +
    </button>


    <!-- =========================
         AFEGIR MANUALMENT
    ========================= -->

    <div
      class="add-box"
      id="addBox"
    >

      <h3>
        ➕ Afegir una demanda
      </h3>

      <select id="newType">

        <option value="Demanda">
          Demanda
        </option>

        <option value="Tasca">
          Tasca
        </option>

        <option value="Recordatori">
          Recordatori
        </option>

        <option value="Data important">
          Data important
        </option>

        <option value="Llista">
          Llista
        </option>

        <option value="Compra">
          Llista de la compra
        </option>

      </select>

      <input
        type="text"
        id="newThing"
        placeholder="Què vols afegir?"
      >

      <button
        class="save-button"
        onclick="saveThing()"
      >
        Afegir
      </button>

    </div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://vogfwuvdlusuzofvlmoj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__F0Kohyak7yCiF5pSDe2uw_wKJkJnfn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       DADES TEMPORALS
    ========================= */

    let requests = [];

    let photos = [];

    let currentUser = null;


    /* =========================
       LOGIN
    ========================= */

    function showMessage(text) {

      document.getElementById(
        "message"
      ).textContent = text;

    }


    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email || !password) {

        showMessage(
          "Escriu el correu i la contrasenya."
        );

        return;
      }


      showMessage(
        "Iniciant sessió..."
      );


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        showMessage(
          "El correu o la contrasenya no són correctes."
        );

        return;
      }


      entrar(data.user);

    }


    async function createAccount() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email || !password) {

        showMessage(
          "Escriu un correu i una contrasenya."
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "La contrasenya ha de tenir almenys 6 caràcters."
        );

        return;
      }


      showMessage(
        "Creant el compte..."
      );


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,
          password: password

        });


      if (error) {

        showMessage(
          error.message
        );

        return;
      }


      if (data.session) {

        entrar(data.user);

      } else {

        showMessage(
          "Compte creat! Revisa el teu correu."
        );

      }

    }


    function entrar(user) {

      currentUser = user;


      document.getElementById(
        "loginScreen"
      ).style.display = "none";


      document.getElementById(
        "appScreen"
      ).style.display = "block";


      const email =
        user.email || "Usuari";


      document.getElementById(
        "usernameDisplay"
      ).textContent = email;


      carregarDades();

      updateClock();

      setInterval(
        updateClock,
        1000
      );

    }


    /* =========================
       HORA
    ========================= */

    function updateClock() {

      const now =
        new Date();


      const hours =
        String(
          now.getHours()
        ).padStart(2, "0");


      const minutes =
        String(
          now.getMinutes()
        ).padStart(2, "0");


      document.getElementById(
        "clock"
      ).textContent =
        hours + ":" + minutes;

    }


    /* =========================
       PANELL
    ========================= */

    function openPanel() {

      document.getElementById(
        "panel"
      ).style.display = "block";

      renderRequests();

      renderPhotos();

    }


    function closePanel() {

      document.getElementById(
        "panel"
      ).style.display = "none";


      document.getElementById(
        "addBox"
      ).style.display = "none";


      document.getElementById(
        "profileEditor"
      ).style.display = "none";

    }


    /* =========================
       PERFIL
    ========================= */

    function toggleProfileEditor() {

      const editor =
        document.getElementById(
          "profileEditor"
        );


      if (
        editor.style.display === "block"
      ) {

        editor.style.display = "none";

      } else {

        editor.style.display = "block";

      }

    }


    function changeEmoji(emoji) {

      document.getElementById(
        "userButton"
      ).textContent = emoji;


      localStorage.setItem(
        "majorEmoji",
        emoji
      );


      document.getElementById(
        "profileEditor"
      ).style.display = "none";

    }


    /* =========================
       CARREGAR DADES
    ========================= */

    function carregarDades() {

      const savedRequests =
        localStorage.getItem(
          "majorRequests"
        );


      const savedPhotos =
        localStorage.getItem(
          "majorPhotos"
        );


      const savedEmoji =
        localStorage.getItem(
          "majorEmoji"
        );


      if (savedRequests) {

        requests =
          JSON.parse(
            savedRequests
          );

      }


      if (savedPhotos) {

        photos =
          JSON.parse(
            savedPhotos
          );

      }


      if (savedEmoji) {

        document.getElementById(
          "userButton"
        ).textContent =
          savedEmoji;

      }


      renderRequests();

      renderPhotos();

    }


    /* =========================
       DEMANDES
    ========================= */

    function addRequest(
      text,
      type
    ) {

      const request = {

        id:
          Date.now(),

        text:
          text,

        type:
          type,

        date:
          new Date().toLocaleString(
            "ca-ES"
          )

      };


      requests.unshift(
        request
      );


      localStorage.setItem(
        "majorRequests",
        JSON.stringify(
          requests
        )
      );


      renderRequests();

    }


    function renderRequests() {

      const container =
        document.getElementById(
          "requestsList"
        );


      if (!requests.length) {

        container.innerHTML =
          '<div class="empty">Encara no tens demandes.</div>';

        return;
      }


      container.innerHTML = "";


      requests.forEach(
        function(request) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "request";


          const info =
            document.createElement(
              "div"
            );


          info.className =
            "request-info";


          const type =
            document.createElement(
              "div"
            );


          type.className =
            "request-type";


          type.textContent =
            request.type;


          const text =
            document.createElement(
              "div"
            );


          text.className =
            "request-text";


          text.textContent =
            request.text;


          info.appendChild(
            type
          );


          info.appendChild(
            text
          );


          const deleteButton =
            document.createElement(
              "button"
            );


          deleteButton.className =
            "delete-button";


          deleteButton.textContent =
            "🗑️";


          deleteButton.onclick =
            function() {

              deleteRequest(
                request.id
              );

            };


          item.appendChild(
            info
          );


          item.appendChild(
            deleteButton
          );


          container.appendChild(
            item
          );

        }
      );

    }


    function deleteRequest(id) {

      requests =
        requests.filter(
          function(request) {

            return request.id !== id;

          }
        );


      localStorage.setItem(
        "majorRequests",
        JSON.stringify(
          requests
        )
      );


      renderRequests();

    }


    /* =========================
       BOTÓ +
    ========================= */

    function openAddBox() {

      const box =
        document.getElementById(
          "addBox"
        );


      if (
        box.style.display === "block"
      ) {

        box.style.display =
          "none";

      } else {

        box.style.display =
          "block";

      }

    }


    function saveThing() {

      const thing =
        document.getElementById(
          "newThing"
        ).value.trim();


      const type =
        document.getElementById(
          "newType"
        ).value;


      if (!thing) {

        return;

      }


      addRequest(
        thing,
        type
      );


      document.getElementById(
        "newThing"
      ).value = "";


      document.getElementById(
        "addBox"
      ).style.display =
        "none";

    }


    /* =========================
       MICROFON
    ========================= */

    function startMicrophone() {

      const text =
        document.getElementById(
          "micText"
        );


      const button =
        document.getElementById(
          "micButton"
        );


      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        text.textContent =
          "El teu navegador no suporta el reconeixement de veu.";

        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "ca-ES";


      recognition.continuous =
        false;


      recognition.interimResults =
        false;


      text.textContent =
        "🎙️ T'estic escoltant...";


      button.classList.add(
        "listening"
      );


      try {

        recognition.start();

      } catch (error) {

        button.classList.remove(
          "listening"
        );


        text.textContent =
          "Torna a prémer el micròfon.";

        return;

      }


      recognition.onresult =
        function(event) {

          const resultat =
            event.results[0][0]
              .transcript
              .trim();


          const resultatMinuscules =
            resultat.toLowerCase();


          console.log(
            "Major ha escoltat:",
            resultat
          );


          /*
             Detectem el tipus
             de demanda.
          */

          let tipus =
            "Demanda";


          /* TASCA */

          if (
            resultatMinuscules.includes("he de") ||
            resultatMinuscules.includes("tinc de") ||
            resultatMinuscules.includes("fer ")
          ) {

            tipus =
              "Tasca";

          }


          /* RECORDATORI */

          else if (
            resultatMinuscules.includes("recorda") ||
            resultatMinuscules.includes("recorda'm") ||
            resultatMinuscules.includes("no t'oblidis")
          ) {

            tipus =
              "Recordatori";

          }


          /* COMPRA */

          else if (
            resultatMinuscules.includes("comprar") ||
            resultatMinuscules.includes("compra") ||
            resultatMinuscules.includes("necessito comprar") ||
            resultatMinuscules.includes("llista de la compra")
          ) {

            tipus =
              "Compra";

          }


          /* LLISTA */

          else if (
            resultatMinuscules.includes("llista") ||
            resultatMinuscules.includes("apunta")
          ) {

            tipus =
              "Llista";

          }


          /* DATA */

          else if (
            resultatMinuscules.includes("demà") ||
            resultatMinuscules.includes("dilluns") ||
            resultatMinuscules.includes("dimarts") ||
            resultatMinuscules.includes("dimecres") ||
            resultatMinuscules.includes("dijous") ||
            resultatMinuscules.includes("divendres") ||
            resultatMinuscules.includes("dissabte") ||
            resultatMinuscules.includes("diumenge") ||
            resultatMinuscules.includes("dia") ||
            resultatMinuscules.includes("aniversari") ||
            resultatMinuscules.includes("data important")
          ) {

            tipus =
              "Data important";

          }


          /*
             Guardem la demanda.
          */

          addRequest(
            resultat,
            tipus
          );


          text.textContent =
            "✅ " +
            tipus +
            ": " +
            resultat;


        };


      recognition.onerror =
        function(event) {

          button.classList.remove(
            "listening"
          );


          if (
            event.error ===
            "not-allowed"
          ) {

            text.textContent =
              "Has de donar permís al micròfon.";

          } else {

            text.textContent =
              "No he pogut escoltar-te. Torna-ho a provar.";

          }

        };


      recognition.onend =
        function() {

          button.classList.remove(
            "listening"
          );

        };

    }


    /* =========================
       GALERIA
    ========================= */

    function openGallery() {

      document.getElementById(
        "photoInput"
      ).click();

    }


    function addPhotos(event) {

      const files =
        Array.from(
          event.target.files
        );


      files.forEach(
        function(file) {

          const reader =
            new FileReader();


          reader.onload =
            function(e) {

              photos.push(
                {
                  id: Date.now() +
                    Math.random(),

                  name: file.name,

                  src: e.target.result,

                  album:
                    "Àlbum principal"
                }
              );


              localStorage.setItem(
                "majorPhotos",
                JSON.stringify(
                  photos
                )
              );


              renderPhotos();

            };


          reader.readAsDataURL(
            file
          );

        }
      );


      event.target.value = "";

    }


    function renderPhotos() {

      const container =
        document.getElementById(
          "galleryPreview"
        );


      container.innerHTML = "";


      photos
        .slice(0, 9)
        .forEach(
          function(photo) {

            const image =
              document.createElement(
                "img"
              );


            image.src =
              photo.src;


            image.style.width =
              "100%";


            image.style.height =
              "80px";


            image.style.objectFit =
              "cover";


            image.style.borderRadius =
              "10px";


            container.appendChild(
              image
            );

          }
        );

    }


    /* =========================
       IDIOMES
    ========================= */

    function changeLanguage() {

      const language =
        document.getElementById(
          "language"
        ).value;


      const subtitle =
        document.getElementById(
          "subtitle"
        );


      const email =
        document.getElementById(
          "email"
        );


      const password =
        document.getElementById(
          "password"
        );


      const button =
        document.querySelector(
          ".login-button"
        );


      const create =
        document.querySelector(
          ".create"
        );


      if (
        language === "ca"
      ) {

        subtitle.textContent =
          "El teu assistent personal";

        email.placeholder =
          "Correu electrònic";

        password.placeholder =
          "Contrasenya";

        button.textContent =
          "Iniciar sessió";

        create.innerHTML =
          'Encara no tens compte? <span onclick="createAccount()">Crear compte</span>';

      }


      else if (
        language === "es"
      ) {

        subtitle.textContent =
          "Tu asistente personal";

        email.placeholder =
          "Correo electrónico";

        password.placeholder =
          "Contraseña";

        button.textContent =
          "Iniciar sesión";

        create.innerHTML =
          '¿Todavía no tienes cuenta? <span onclick="createAccount()">Crear cuenta</span>';

      }


      else {

        subtitle.textContent =
          "Your personal assistant";

        email.placeholder =
          "Email";

        password.placeholder =
          "Password";

        button.textContent =
          "Log in";

        create.innerHTML =
          'Don’t have an account? <span onclick="createAccount()">Create account</span>';

      }

    }

  </script>
