<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Major</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f4edff);
    }

    button {
      cursor: pointer;
    }

    /* LOGIN */

    .login {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
      text-align: center;

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6d5dfc;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #5b6cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .create {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }

    .create span {
      color: #6d5dfc;
      font-weight: bold;
      cursor: pointer;
    }

    .language {
      margin-top: 25px;
    }

    select {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    /* APP */

    .app {
      display: none;
      min-height: 100vh;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
    }

    .user-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);
      color: white;
      font-size: 23px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(91,108,255,.3);
    }

    .welcome {
      text-align: center;
      margin-top: 130px;
    }

    .welcome h2 {
      font-size: 46px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #777;
      font-size: 18px;
    }

    /* PANELL LILA */

    .panel {
      display: none;

      position: fixed;
      top: 0;
      right: 0;

      width: 390px;
      max-width: 90%;

      height: 100vh;

      background: linear-gradient(160deg, #725cff, #9b5de5);

      color: white;

      padding: 25px;

      box-shadow: -10px 0 35px rgba(0,0,0,.2);

      z-index: 10;
    }

    .panel-header {
      display: flex;
      justify-content: flex-end;
    }

    .close-button {
      width: 45px;
      height: 45px;

      border-radius: 50%;
      border: none;

      background: rgba(255,255,255,.18);

      color: white;

      font-size: 28px;
    }

    .panel-content {
      height: calc(100% - 70px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .panel-title {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .panel-description {
      text-align: center;
      opacity: .85;
      margin-bottom: 45px;
      line-height: 1.5;
    }

    /* MICROFON */

    .mic-button {
      width: 125px;
      height: 125px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 50px;

      box-shadow: 0 12px 30px rgba(0,0,0,.22);

      margin-bottom: 30px;

      transition: transform .15s;
    }

    .mic-button:active {
      transform: scale(.94);
    }

    .mic-button.listening {
      transform: scale(1.08);

      box-shadow:
        0 0 0 12px rgba(255,255,255,.18),
        0 12px 30px rgba(0,0,0,.22);
    }

    .mic-text {
      font-size: 15px;
      opacity: .9;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    /* + */

    .add-button {
      position: absolute;

      bottom: 30px;
      right: 30px;

      width: 62px;
      height: 62px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 38px;

      box-shadow: 0 10px 25px rgba(0,0,0,.2);
    }

    /* AFEGIR */

    .add-box {
      display: none;

      position: absolute;

      bottom: 105px;
      left: 25px;
      right: 25px;

      background: white;
      color: #222;

      border-radius: 18px;

      padding: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .add-box h3 {
      margin-bottom: 15px;
    }

    .save-button {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 10px;

      background: #765cff;
      color: white;

      font-weight: bold;
    }

    @media (max-width: 500px) {
      .welcome h2 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div class="login" id="loginScreen">

    <div class="logo">M</div>

    <h1>Major</h1>

    <p class="subtitle" id="subtitle">
      El teu assistent personal
    </p>

    <input
      type="email"
      id="email"
      placeholder="Correu electrònic"
    >

    <input
      type="password"
      id="password"
      placeholder="Contrasenya"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      Iniciar sessió
    </button>

    <p class="create">
      Encara no tens compte?
      <span onclick="createAccount()">
        Crear compte
      </span>
    </p>

    <div class="language">

      <select
        id="language"
        onchange="changeLanguage()"
      >

        <option value="ca">Català</option>
        <option value="es">Castellà</option>
        <option value="en">English</option>

      </select>

    </div>

    <div
      class="message"
      id="message"
    ></div>

  </div>


  <!-- APP -->

  <div
    class="app"
    id="appScreen"
  >

    <div class="topbar">

      <button
        class="user-button"
        onclick="openPanel()"
      >
        1
      </button>

    </div>

    <div class="welcome">

      <h2>
        Hola! 👋
      </h2>

      <p>
        Què necessites avui?
      </p>

    </div>

  </div>


  <!-- PANELL LILA -->

  <div
    class="panel"
    id="panel"
  >

    <div class="panel-header">

      <button
        class="close-button"
        onclick="closePanel()"
      >
        ×
      </button>

    </div>


    <div class="panel-content">

      <div class="panel-title">
        Major
      </div>

      <div class="panel-description">
        Digues-me què necessites<br>
        i jo m'encarrego de la resta.
      </div>


      <button
        class="mic-button"
        id="micButton"
        onclick="startMicrophone()"
      >
        🎙️
      </button>

      <div
        class="mic-text"
        id="micText"
      >
        Prem el micròfon i parla
      </div>

    </div>


    <button
      class="add-button"
      onclick="openAddBox()"
    >
      +
    </button>


    <div
      class="add-box"
      id="addBox"
    >

      <h3>
        Afegir una cosa
      </h3>

      <input
        type="text"
        id="newThing"
        placeholder="Què vols afegir?"
      >

      <button
        class="save-button"
        onclick="saveThing()"
      >
        Afegir
      </button>

    </div>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://vogfwuvdlusuzofvlmoj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__F0Kohyak7yCiF5pSDe2uw_wKJkJnfn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       LOGIN
    ========================= */

    function showMessage(text) {

      document.getElementById("message").textContent =
        text;

    }


    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {

        showMessage(
          "Escriu el correu i la contrasenya."
        );

        return;
      }

      showMessage(
        "Iniciant sessió..."
      );

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });

      if (error) {

        showMessage(
          "El correu o la contrasenya no són correctes."
        );

        return;
      }

      entrar(data.user);

    }


    async function createAccount() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {

        showMessage(
          "Escriu un correu i una contrasenya."
        );

        return;
      }

      if (password.length < 6) {

        showMessage(
          "La contrasenya ha de tenir almenys 6 caràcters."
        );

        return;
      }

      showMessage(
        "Creant el compte..."
      );

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,
          password: password

        });

      if (error) {

        showMessage(
          error.message
        );

        return;
      }

      if (data.session) {

        entrar(data.user);

      } else {

        showMessage(
          "Compte creat! Revisa el teu correu."
        );

      }

    }


    function entrar(user) {

      document.getElementById(
        "loginScreen"
      ).style.display = "none";

      document.getElementById(
        "appScreen"
      ).style.display = "block";

    }


    /* =========================
       PANELL
    ========================= */

    function openPanel() {

      document.getElementById(
        "panel"
      ).style.display = "block";

    }


    function closePanel() {

      document.getElementById(
        "panel"
      ).style.display = "none";

      document.getElementById(
        "addBox"
      ).style.display = "none";

    }


    /* =========================
       BOTÓ +
    ========================= */

    function openAddBox() {

      const box =
        document.getElementById("addBox");

      if (box.style.display === "block") {

        box.style.display = "none";

      } else {

        box.style.display = "block";

      }

    }


    function saveThing() {

      const thing =
        document.getElementById(
          "newThing"
        ).value.trim();

      if (!thing) {
        return;
      }

      alert(
        "Major ha rebut: " + thing
      );

      document.getElementById(
        "newThing"
      ).value = "";

      document.getElementById(
        "addBox"
      ).style.display = "none";

    }


    /* =========================
       MICROFON 🎙️
    ========================= */

    function startMicrophone() {

      const text =
        document.getElementById(
          "micText"
        );

      const button =
        document.getElementById(
          "micButton"
        );


      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        text.textContent =
          "El teu navegador no suporta el reconeixement de veu.";

        return;
      }


      const recognition =
        new SpeechRecognition();


      /* Català */

      recognition.lang =
        "ca-ES";

      recognition.continuous =
        false;

      recognition.interimResults =
        false;


      text.textContent =
        "🎙️ T'estic escoltant...";

      button.classList.add(
        "listening"
      );


      try {

        recognition.start();

      } catch (error) {

        button.classList.remove(
          "listening"
        );

        text.textContent =
          "Torna a prémer el micròfon.";

        return;
      }


      /* =========================
         RESULTAT DE LA VEU
      ========================= */

      recognition.onresult =
        function(event) {

          const resultat =
            event.results[0][0].transcript
              .trim();


          console.log(
            "Major ha escoltat:",
            resultat
          );


          /*
             Primer mostrem
             el que has dit.
          */

          text.textContent =
            "Has dit: " + resultat;


          /*
             Paraules que poden indicar
             que estàs dient una tasca.
          */

          const paraulesTasca = [

            "he de",
            "tinc de",
            "recorda'm",
            "recorda",
            "demà",
            "avui",

            "dilluns",
            "dimarts",
            "dimecres",
            "dijous",
            "divendres",
            "dissabte",
            "diumenge"

          ];


          /*
             Convertim el text
             a minúscules.
          */

          const resultatMinuscules =
            resultat.toLowerCase();


          /*
             Mirem si alguna paraula
             de la llista apareix
             dins del que has dit.
          */

          const esTasca =
            paraulesTasca.some(
              function(paraula) {

                return resultatMinuscules
                  .includes(paraula);

              }
            );


          /*
             SI ÉS UNA TASCA
          */

          if (esTasca) {

            text.textContent =
              "✅ Tasca detectada: " +
              resultat;


            alert(
              "Major ha detectat una tasca:\n\n" +
              resultat
            );

          }


          /*
             SI NO ÉS UNA TASCA
          */

          else {

            text.textContent =
              "Has dit: " + resultat;

          }

        };


      /* =========================
         ERROR
      ========================= */

      recognition.onerror =
        function(event) {

          button.classList.remove(
            "listening"
          );


          if (
            event.error ===
            "not-allowed"
          ) {

            text.textContent =
              "Has de donar permís al micròfon.";

          } else {

            text.textContent =
              "No he pogut escoltar-te. Torna-ho a provar.";

          }

        };


      /* =========================
         FINAL DEL MICROFON
      ========================= */

      recognition.onend =
        function() {

          button.classList.remove(
            "listening"
          );

          console.log(
            "Micròfon aturat"
          );

        };

    }


    /* =========================
       IDIOMES
    ========================= */

    function changeLanguage() {

      const language =
        document.getElementById(
          "language"
        ).value;

      const subtitle =
        document.getElementById(
          "subtitle"
        );

      const email =
        document.getElementById(
          "email"
        );

      const password =
        document.getElementById(
          "password"
        );

      const button =
        document.querySelector(
          ".login-button"
        );

      const create =
        document.querySelector(
          ".create"
        );


      if (language === "ca") {

        subtitle.textContent =
          "El teu assistent personal";

        email.placeholder =
          "Correu electrònic";

        password.placeholder =
          "Contrasenya";

        button.textContent =
          "Iniciar sessió";

        create.innerHTML =
          'Encara no tens compte? <span onclick="createAccount()">Crear compte</span>';

      }


      else if (language === "es") {

        subtitle.textContent =
          "Tu asistente personal";

        email.placeholder =
          "Correo electrónico";

        password.placeholder =
          "Contraseña";

        button.textContent =
          "Iniciar sesión";

        create.innerHTML =
          '¿Todavía no tienes cuenta? <span onclick="createAccount()">Crear cuenta</span>';

      }


      else {

        subtitle.textContent =
          "Your personal assistant";

        email.placeholder =
          "Email";

        password.placeholder =
          "Password";

        button.textContent =
          "Log in";

        create.innerHTML =
          'Don’t have an account? <span onclick="createAccount()">Create account</span>';

      }

    }

  </script>

</body>
</html>
