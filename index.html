<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Major</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f4edff);
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    .login {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
      text-align: center;

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6d5dfc;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #5b6cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .create {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }

    .create span {
      color: #6d5dfc;
      font-weight: bold;
      cursor: pointer;
    }

    .language {
      margin-top: 25px;
    }

    select {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
    }

    .message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    .app {
      display: none;
      min-height: 100vh;
      padding: 25px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    /* PERFIL */

    .profile-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #4f7cff, #8b5cf6);
      color: white;
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(91,108,255,.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .edit-profile-button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: white;
      font-size: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.12);
    }

    /* BENVINGUDA */

    .welcome {
      text-align: center;
      margin-top: 90px;
    }

    .welcome h2 {
      font-size: 46px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #777;
      font-size: 18px;
    }

    /* =========================
       DEMANDES
    ========================= */

    .demands-container {
      width: 90%;
      max-width: 650px;
      margin: 45px auto 0;
    }

    .demands-title {
      font-size: 24px;
      margin-bottom: 15px;
      color: #333;
    }

    .demand-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .demand {
      background: white;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,.07);
    }

    .demand-text {
      flex: 1;
      font-size: 16px;
      color: #333;
      line-height: 1.4;
    }

    .delete-demand {
      border: none;
      background: transparent;
      font-size: 19px;
      opacity: .65;
    }

    .delete-demand:hover {
      opacity: 1;
    }

    .empty-demands {
      color: #888;
      text-align: center;
      padding: 20px;
    }

    /* =========================
       PANELL LILA
    ========================= */

    .panel {
      display: none;

      position: fixed;
      top: 0;
      right: 0;

      width: 390px;
      max-width: 90%;

      height: 100vh;

      background: linear-gradient(160deg, #725cff, #9b5de5);

      color: white;

      padding: 25px;

      box-shadow: -10px 0 35px rgba(0,0,0,.2);

      z-index: 10;
    }

    .panel-header {
      display: flex;
      justify-content: flex-end;
    }

    .close-button {
      width: 45px;
      height: 45px;

      border-radius: 50%;
      border: none;

      background: rgba(255,255,255,.18);

      color: white;

      font-size: 28px;
    }

    .panel-content {
      height: calc(100% - 70px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .panel-title {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .panel-question {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .panel-description {
      text-align: center;
      opacity: .85;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* =========================
       MICROFON
    ========================= */

    .mic-button {
      width: 125px;
      height: 125px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 50px;

      box-shadow: 0 12px 30px rgba(0,0,0,.22);

      margin-bottom: 22px;

      transition: transform .15s;
    }

    .mic-button:active {
      transform: scale(.94);
    }

    .mic-button.listening {
      transform: scale(1.08);

      box-shadow:
        0 0 0 12px rgba(255,255,255,.18),
        0 12px 30px rgba(0,0,0,.22);
    }

    .mic-text {
      font-size: 15px;
      opacity: .9;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
      min-height: 45px;
    }

    /* =========================
       DEMANDES DINS DEL PANELL
    ========================= */

    .demands-button {
      margin-top: 25px;

      width: 100%;
      max-width: 280px;

      padding: 14px;

      border: none;
      border-radius: 14px;

      background: rgba(255,255,255,.18);

      color: white;

      font-size: 16px;
      font-weight: bold;
    }

    .demands-button:hover {
      background: rgba(255,255,255,.25);
    }

    /* =========================
       CAIXA DE DEMANDES
    ========================= */

    .demands-box {
      display: none;

      position: absolute;

      top: 90px;
      left: 25px;
      right: 25px;
      bottom: 25px;

      background: white;
      color: #222;

      border-radius: 20px;

      padding: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,.25);

      overflow-y: auto;
    }

    .demands-box h3 {
      margin-bottom: 18px;
    }

    .panel-demand-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-demand {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 12px;

      background: #f5f3ff;

      border-radius: 12px;
    }

    .panel-demand-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
    }

    .panel-delete-button {
      border: none;
      background: transparent;
      font-size: 18px;
    }

    /* =========================
       +
    ========================= */

    .add-button {
      position: absolute;

      bottom: 30px;
      right: 30px;

      width: 62px;
      height: 62px;

      border-radius: 50%;
      border: none;

      background: white;
      color: #765cff;

      font-size: 38px;

      box-shadow: 0 10px 25px rgba(0,0,0,.2);
    }

    /* =========================
       AFEGIR DEMANDA
    ========================= */

    .add-box {
      display: none;

      position: absolute;

      bottom: 105px;
      left: 25px;
      right: 25px;

      background: white;
      color: #222;

      border-radius: 18px;

      padding: 20px;

      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .add-box h3 {
      margin-bottom: 15px;
    }

    .save-button {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 10px;

      background: #765cff;
      color: white;

      font-weight: bold;
    }

    /* =========================
       PERFIL / EMOJI
    ========================= */

    .profile-box {
      display: none;

      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 90%;
      max-width: 400px;

      background: white;

      color: #222;

      border-radius: 22px;

      padding: 25px;

      box-shadow: 0 15px 40px rgba(0,0,0,.25);

      z-index: 30;
    }

    .profile-box h3 {
      margin-bottom: 18px;
      text-align: center;
    }

    .profile-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .emoji-option {
      border: none;
      background: #f3f1ff;
      border-radius: 12px;
      font-size: 27px;
      padding: 10px;
    }

    .emoji-option:hover {
      background: #e7e2ff;
    }

    .photo-button {
      width: 100%;
      padding: 13px;

      border: none;
      border-radius: 12px;

      background: #765cff;

      color: white;

      font-weight: bold;

      margin-bottom: 10px;
    }

    .close-profile {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 12px;

      background: #eee;

      color: #333;
    }

    #photoInput {
      display: none;
    }

    @media (max-width: 500px) {

      .welcome h2 {
        font-size: 38px;
      }

      .demands-container {
        width: 100%;
      }

      .profile-options {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <div class="login" id="loginScreen">

    <div class="logo">M</div>

    <h1>Major</h1>

    <p class="subtitle" id="subtitle">
      El teu assistent personal
    </p>

    <input
      type="email"
      id="email"
      placeholder="Correu electrònic"
    >

    <input
      type="password"
      id="password"
      placeholder="Contrasenya"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      Iniciar sessió
    </button>

    <p class="create">
      Encara no tens compte?
      <span onclick="createAccount()">
        Crear compte
      </span>
    </p>

    <div class="language">

      <select
        id="language"
        onchange="changeLanguage()"
      >

        <option value="ca">Català</option>
        <option value="es">Castellà</option>
        <option value="en">English</option>

      </select>

    </div>

    <div
      class="message"
      id="message"
    ></div>

  </div>


  <!-- =========================
       APP
  ========================= -->

  <div
    class="app"
    id="appScreen"
  >

    <div class="topbar">

      <button
        class="profile-button"
        id="profileButton"
        onclick="openPanel()"
      >
        🙂
      </button>

      <button
        class="edit-profile-button"
        onclick="openProfileEditor()"
      >
        ✏️
      </button>

    </div>


    <div class="welcome">

      <h2>
        Hola! 👋
      </h2>

      <p>
        Què necessites avui?
      </p>

    </div>


    <!-- DEMANDES -->

    <div class="demands-container">

      <div class="demands-title">
        📋 Les meves demandes
      </div>

      <div
        class="demand-list"
        id="demandList"
      ></div>

    </div>

  </div>


  <!-- =========================
       PANELL LILA
  ========================= -->

  <div
    class="panel"
    id="panel"
  >

    <div class="panel-header">

      <button
        class="close-button"
        onclick="closePanel()"
      >
        ×
      </button>

    </div>


    <div class="panel-content">

      <div class="panel-title">
        Major
      </div>

      <div class="panel-question">
        Què farem avui? ✨
      </div>

      <div class="panel-description">
        Parla amb Major i jo guardaré<br>
        les teves demandes.
      </div>


      <!-- MICROFON -->

      <button
        class="mic-button"
        id="micButton"
        onclick="startMicrophone()"
      >
        🎙️
      </button>

      <div
        class="mic-text"
        id="micText"
      >
        Prem el micròfon i parla
      </div>


      <!-- DEMANDES -->

      <button
        class="demands-button"
        onclick="openDemandsBox()"
      >
        📋 Les meves demandes
      </button>

    </div>


    <!-- + -->

    <button
      class="add-button"
      onclick="openAddBox()"
    >
      +
    </button>


    <!-- AFEGIR -->

    <div
      class="add-box"
      id="addBox"
    >

      <h3>
        Afegir una demanda
      </h3>

      <input
        type="text"
        id="newThing"
        placeholder="Què vols afegir?"
      >

      <button
        class="save-button"
        onclick="saveThing()"
      >
        Afegir
      </button>

    </div>


    <!-- LLISTA DEMANDES -->

    <div
      class="demands-box"
      id="demandsBox"
    >

      <h3>
        📋 Les meves demandes
      </h3>

      <div
        class="panel-demand-list"
        id="panelDemandList"
      ></div>

    </div>

  </div>


  <!-- =========================
       EDITOR PERFIL
  ========================= -->

  <div
    class="profile-box"
    id="profileBox"
  >

    <h3>
      Personalitza el teu perfil
    </h3>


    <div class="profile-options">

      <button
        class="emoji-option"
        onclick="chooseEmoji('😀')"
      >
        😀
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('😎')"
      >
        😎
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('🐶')"
      >
        🐶
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('🐱')"
      >
        🐱
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('🦊')"
      >
        🦊
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('🌸')"
      >
        🌸
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('⭐')"
      >
        ⭐
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('💜')"
      >
        💜
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('⚽')"
      >
        ⚽
      </button>

      <button
        class="emoji-option"
        onclick="chooseEmoji('🎮')"
      >
        🎮
      </button>

    </div>


    <button
      class="photo-button"
      onclick="document.getElementById('photoInput').click()"
    >
      📷 Escollir una foto
    </button>


    <input
      type="file"
      id="photoInput"
      accept="image/*"
      onchange="choosePhoto(event)"
    >


    <button
      class="close-profile"
      onclick="closeProfileEditor()"
    >
      Tancar
    </button>

  </div>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://vogfwuvdlusuzofvlmoj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__F0Kohyak7yCiF5pSDe2uw_wKJkJnfn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       DEMANDES
    ========================= */

    let demands =
      JSON.parse(
        localStorage.getItem("majorDemands") || "[]"
      );


    function saveDemands() {

      localStorage.setItem(
        "majorDemands",
        JSON.stringify(demands)
      );

    }


    function renderDemands() {

      const list =
        document.getElementById(
          "demandList"
        );

      list.innerHTML = "";


      if (demands.length === 0) {

        list.innerHTML =
          '<div class="empty-demands">Encara no tens cap demanda. 😊</div>';

        return;
      }


      demands.forEach(
        function(demand, index) {

          const element =
            document.createElement("div");

          element.className =
            "demand";


          const text =
            document.createElement("div");

          text.className =
            "demand-text";

          text.textContent =
            demand;


          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "delete-demand";

          deleteButton.textContent =
            "🗑️";


          deleteButton.onclick =
            function() {

              deleteDemand(index);

            };


          element.appendChild(
            text
          );

          element.appendChild(
            deleteButton
          );


          list.appendChild(
            element
          );

        }
      );

    }


    function renderPanelDemands() {

      const list =
        document.getElementById(
          "panelDemandList"
        );

      list.innerHTML = "";


      if (demands.length === 0) {

        list.innerHTML =
          '<div class="empty-demands">Encara no tens cap demanda. 😊</div>';

        return;
      }


      demands.forEach(
        function(demand, index) {

          const element =
            document.createElement("div");

          element.className =
            "panel-demand";


          const text =
            document.createElement("div");

          text.className =
            "panel-demand-text";

          text.textContent =
            demand;


          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "panel-delete-button";

          deleteButton.textContent =
            "🗑️";


          deleteButton.onclick =
            function() {

              deleteDemand(index);

            };


          element.appendChild(
            text
          );

          element.appendChild(
            deleteButton
          );


          list.appendChild(
            element
          );

        }
      );

    }


    function addDemand(text) {

      if (!text || !text.trim()) {
        return;
      }


      demands.push(
        text.trim()
      );


      saveDemands();

      renderDemands();

      renderPanelDemands();

    }


    function deleteDemand(index) {

      demands.splice(
        index,
        1
      );


      saveDemands();

      renderDemands();

      renderPanelDemands();

    }


    /* =========================
       LOGIN
    ========================= */

    function showMessage(text) {

      document.getElementById(
        "message"
      ).textContent =
        text;

    }


    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email || !password) {

        showMessage(
          "Escriu el correu i la contrasenya."
        );

        return;
      }


      showMessage(
        "Iniciant sessió..."
      );


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        showMessage(
          "El correu o la contrasenya no són correctes."
        );

        return;
      }


      entrar(data.user);

    }


    async function createAccount() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email || !password) {

        showMessage(
          "Escriu un correu i una contrasenya."
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "La contrasenya ha de tenir almenys 6 caràcters."
        );

        return;
      }


      showMessage(
        "Creant el compte..."
      );


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password

        });


      if (error) {

        showMessage(
          error.message
        );

        return;
      }


      if (data.session) {

        entrar(data.user);

      } else {

        showMessage(
          "Compte creat! Revisa el teu correu."
        );

      }

    }


    function entrar(user) {

      document.getElementById(
        "loginScreen"
      ).style.display =
        "none";


      document.getElementById(
        "appScreen"
      ).style.display =
        "block";


      renderDemands();

    }


    /* =========================
       PANELL
    ========================= */

    function openPanel() {

      document.getElementById(
        "panel"
      ).style.display =
        "block";


      renderPanelDemands();

    }


    function closePanel() {

      document.getElementById(
        "panel"
      ).style.display =
        "none";


      document.getElementById(
        "addBox"
      ).style.display =
        "none";


      document.getElementById(
        "demandsBox"
      ).style.display =
        "none";

    }


    /* =========================
       DEMANDES
    ========================= */

    function openDemandsBox() {

      const box =
        document.getElementById(
          "demandsBox"
        );


      renderPanelDemands();


      if (box.style.display === "block") {

        box.style.display =
          "none";

      } else {

        box.style.display =
          "block";

      }

    }


    /* =========================
       BOTÓ +
    ========================= */

    function openAddBox() {

      const box =
        document.getElementById(
          "addBox"
        );


      if (box.style.display === "block") {

        box.style.display =
          "none";

      } else {

        box.style.display =
          "block";

      }

    }


    function saveThing() {

      const input =
        document.getElementById(
          "newThing"
        );


      const thing =
        input.value.trim();


      if (!thing) {
        return;
      }


      addDemand(
        thing
      );


      input.value =
        "";


      document.getElementById(
        "addBox"
      ).style.display =
        "none";


      document.getElementById(
        "micText"
      ).textContent =
        "✅ Demanda afegida!";

    }


    /* =========================
       MICROFON
    ========================= */

    function startMicrophone() {

      const text =
        document.getElementById(
          "micText"
        );


      const button =
        document.getElementById(
          "micButton"
        );


      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        text.textContent =
          "El teu navegador no suporta el reconeixement de veu.";

        return;
      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "ca-ES";

      recognition.continuous =
        false;

      recognition.interimResults =
        false;


      text.textContent =
        "🎙️ T'estic escoltant...";


      button.classList.add(
        "listening"
      );


      try {

        recognition.start();

      } catch (error) {

        button.classList.remove(
          "listening"
        );

        text.textContent =
          "Torna a prémer el micròfon.";

        return;
      }


      recognition.onresult =
        function(event) {

          const resultat =
            event.results[0][0]
              .transcript
              .trim();


          if (!resultat) {
            return;
          }


          console.log(
            "Major ha escoltat:",
            resultat
          );


          addDemand(
            resultat
          );


          text.textContent =
            "✅ Demanda guardada: " +
            resultat;

        };


      recognition.onerror =
        function(event) {

          button.classList.remove(
            "listening"
          );


          if (
            event.error ===
            "not-allowed"
          ) {

            text.textContent =
              "Has de donar permís al micròfon.";

          } else {

            text.textContent =
              "No he pogut escoltar-te. Torna-ho a provar.";

          }

        };


      recognition.onend =
        function() {

          button.classList.remove(
            "listening"
          );

        };

    }


    /* =========================
       PERFIL
    ========================= */

    let profile =
      JSON.parse(
        localStorage.getItem(
          "majorProfile"
        ) || "null"
      );


    function saveProfile() {

      localStorage.setItem(
        "majorProfile",
        JSON.stringify(profile)
      );

    }


    function renderProfile() {

      const button =
        document.getElementById(
          "profileButton"
        );


      button.innerHTML = "";


      if (
        profile &&
        profile.type === "photo" &&
        profile.value
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          profile.value;


        button.appendChild(
          img
        );


      } else if (
        profile &&
        profile.type === "emoji"
      ) {

        button.textContent =
          profile.value;


      } else {

        button.textContent =
          "🙂";

      }

    }


    function openProfileEditor() {

      document.getElementById(
        "profileBox"
      ).style.display =
        "block";

    }


    function closeProfileEditor() {

      document.getElementById(
        "profileBox"
      ).style.display =
        "none";

    }


    function chooseEmoji(emoji) {

      profile = {

        type: "emoji",

        value: emoji

      };


      saveProfile();

      renderProfile();

      closeProfileEditor();

    }


    function choosePhoto(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          profile = {

            type: "photo",

            value: e.target.result

          };


          saveProfile();

          renderProfile();

          closeProfileEditor();

        };


      reader.readAsDataURL(
        file
      );

    }


    /* =========================
       IDIOMES
    ========================= */

    function changeLanguage() {

      const language =
        document.getElementById(
          "language"
        ).value;


      const subtitle =
        document.getElementById(
          "subtitle"
        );


      const email =
        document.getElementById(
          "email"
        );


      const password =
        document.getElementById(
          "password"
        );


      const button =
        document.querySelector(
          ".login-button"
        );


      const create =
        document.querySelector(
          ".create"
        );


      if (language === "ca") {

        subtitle.textContent =
          "El teu assistent personal";

        email.placeholder =
          "Correu electrònic";

        password.placeholder =
          "Contrasenya";

        button.textContent =
          "Iniciar sessió";

        create.innerHTML =
          'Encara no tens compte? <span onclick="createAccount()">Crear compte</span>';

      }


      else if (language === "es") {

        subtitle.textContent =
          "Tu asistente personal";

        email.placeholder =
          "Correo electrónico";

        password.placeholder =
          "Contraseña";

        button.textContent =
          "Iniciar sesión";

        create.innerHTML =
          '¿Todavía no tienes cuenta? <span onclick="createAccount()">Crear cuenta</span>';

      }


      else {

        subtitle.textContent =
          "Your personal assistant";

        email.placeholder =
          "Email";

        password.placeholder =
          "Password";

        button.textContent =
          "Log in";

        create.innerHTML =
          'Don’t have an account? <span onclick="createAccount()">Create account</span>';

      }

    }


    /* =========================
       INICIAR
    ========================= */

    renderDemands();

    renderProfile();

  </script>

</body>
</html>
